<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Lost & Found Items | Community Recovery</title>
    
    <!-- External Dependencies, Google Fonts: Inter (modern, highly readable) -->
    <script src="https://cdn.tailwindcss.com"></script>     <!-- TailwindCSS CDN for utility classes -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

    <!--CSS Stylessheet-->
    <link rel=""stylesheet" href="styles.css">
</head>
<body class="flex items-center justify-center p-4 sm:p-5">
     <div class="glass-panel w-full max-w-2xl rounded-2xl overflow-hidden flex flex-col max-h-[92vh] shadow-2xl">

        <!-- HEADER: Title, icon, and total report count -->
        <div class="bg-white border-b border-indigo-50/80 p-5 sm:p-6">
            <div class="flex items-center justify-between mb-5">
                <div class="flex items-center gap-3">
                    <!-- Logo / Icon badge with gradient -->
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-md">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
                            <path d="M2 12h20"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Lost &amp; Found</h1>
                        <p class="text-xs text-gray-500 font-medium">Community recovery hub</p>
                    </div>
                </div>
                <!-- Dynamic counter: shows total number of reports -->
                <div class="text-right">
                    <span id="total-items" class="text-2xl font-extrabold text-indigo-600">0</span>
                    <p class="text-[11px] text-gray-400 uppercase tracking-wider font-semibold">reports</p>
                </div>
            </div>

     <!-- Mode Toggle Buttons: Report vs Browse -->
            <div class="flex p-1 bg-gray-100/80 rounded-xl">
                <button onclick="switchMode('report')" id="btn-report" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 tab-active flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    Report Item
                </button>
 <button onclick="switchMode('browse')" id="btn-browse" class="flex-1 py-2.5 rounded-lg text-sm font-semibold text-gray-600 hover:text-gray-900 transition-all flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.3-4.3"/>
                    </svg>
                    Browse Items
                </button>
            </div>
        </div>

 <!-- SCROLLABLE CONTENT AREA (dynamic: either report form or browse list) -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-5 sm:p-6 bg-gray-50/40">

            <!-- ========== REPORT FORM SECTION ========== -->
            <div id="section-report" class="fade-in space-y-5">

                <!-- Radio toggle: I LOST / I FOUND -->
                <div class="flex gap-3 mb-2">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="type" value="lost" class="peer sr-only" checked>
                        <div class="p-3.5 rounded-xl border-2 border-gray-200 peer-checked:border-red-500 peer-checked:bg-red-50/60 transition-all text-center">
                            <div class="w-8 h-8 mx-auto mb-1 rounded-full bg-red-100 text-red-600 flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/>
                                </svg>
                            </div>
                            <span class="text-sm font-semibold text-gray-700 peer-checked:text-red-700">I LOST</span>
                        </div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="type" value="found" class="peer sr-only">
                        <div class="p-3.5 rounded-xl border-2 border-gray-200 peer-checked:border-emerald-500 peer-checked:bg-emerald-50/60 transition-all text-center">
                            <div class="w-8 h-8 mx-auto mb-1 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
                                    <path d="m9 12 2 2 4-4"/>
                                </svg>
                            </div>
                            <span class="text-sm font-semibold text-gray-700 peer-checked:text-emerald-700">I FOUND</span>
                        </div>
                    </label>
                </div>
  <!-- Main submission form with enhanced validation -->
                <form id="item-form" onsubmit="Submit(event)" class="space-y-4" novalidate>

                    <!-- Item Name (required) -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Item name *</label>
                        <input type="text" id="item-name" required placeholder="e.g., Grey Laptop, Red Backpack, AirPods"
                               class="w-full px-4 py- rounded-xl border border-gray-200 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-200 outline-none transition">
                        <div class="error-message" id="error-name">Please enter the item name</div>
                    </div>
